{const o2=S.off%1,gc=["#2f8f46","#3da35a","#237a3a"];

let AC=null,MU=true,mg,bg,eng=null,nx=0,sp=0;
function aInit(){if(AC){AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=MU?1:0;mg.connect(AC.destination);bg=AC.createGain();bg.gain.value=.7;bg.connect(mg);

function tone(f,t,d,ty,v,dst){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dst||mg);o.start(t);o.stop(t+d+.05)}
function kick(t,dst){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(dst);o.start(t);o.stop(t+.25)}
function bgStep(i,t){const k=i%16,m=[0,2,4,2,5,4,2,0,1,3,5,3,6,5,3,1][k],n5=n=>261*2**(n/5);
tone(n5(m),t,.5,"triangle",.09,bg);if(k%4==0)tone(110*2**([0,3,2,4][(i>>2)&3]/5),t,.9,"sine",.14,bg);
if(k%8==4)tone(n5(m+5),t,.6,"sine",.05,bg);if(k==0||k==6||k==10)kick(t,bg);if(k%4==2)tone(1800,t,.04,"square",.015,bg)}
function sfx(n){if(!AC||AC.state!="running")return;const t=AC.currentTime;
